name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Single test execution: test:coverage runs the headless tests under c8,
      # serving as BOTH the pass/fail gate (c8 propagates the test runner exit
      # code) and the baseline coverage report. Tests run once, build runs once
      # (test:coverage does not rebuild) — no double-build, no double-test-run.
      - name: Test with coverage
        run: npm run test:coverage

      # Upload the lcov from a single matrix leg only (avoids duplicate artifacts).
      - name: Upload coverage (lcov)
        if: matrix.node == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
