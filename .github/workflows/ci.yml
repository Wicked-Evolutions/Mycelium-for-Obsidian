name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # test:coverage runs the headless tests once under c8 and serves as both the
      # pass/fail gate and baseline coverage report. The later package gate builds
      # again through npm pack's prepare lifecycle, but does not rerun this suite.
      - name: Test with coverage
        run: npm run test:coverage

      # Upload the lcov from a single matrix leg only (avoids duplicate artifacts).
      - name: Upload coverage (lcov)
        if: matrix.node == '22.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

      - name: Verify npm package
        run: npm run test:package
